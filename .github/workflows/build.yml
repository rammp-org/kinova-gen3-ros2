name: Build and Publish

on:
  push:
    branches: [main, dev]
    tags: ["v*"]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  fragment:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Validated against sheppy itself, not a copied script. The template's
      # validate_fragment.py requires a `container:` mapping and would reject
      # this module's compose-based fragments outright.
      - name: Install sheppy
        run: pip install pyyaml "sheppy @ git+https://github.com/rammp-org/sheppy@main"

      - name: Validate the fragments
        run: python3 scripts/check_fragments.py rammp-alternative*.yaml

  smoke:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # The SIM image: smoke is the hardware-free path by design, and the
      # runner has no arm. The fragment declaring the real arm does not change
      # what CI can run.
      - name: Build the sim image
        run: docker build -t kinova-gen3-ros2:ci .

      - name: Publishes, and exits on SIGTERM
        run: SMOKE_PATTERN="kinova_gen3_node up" ./scripts/smoke.sh kinova-gen3-ros2:ci

  publish:
    needs: [fragment, smoke]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: image
        name: Compute lowercase image name
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=long

      # Both arches. amd64 was verified 2026-09-03: the image builds (cmeel
      # ships manylinux_2_28_x86_64 wheels), the node starts, and conformance
      # passes 32/32 -- the same numbers as arm64. arm64 is what the robot
      # needs and is the QEMU-emulated long pole here either way, so amd64
      # costs little on top.
      #
      # This publishes the SIM image only. The KORTEX build links a proprietary
      # SDK and is never pushed.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64,linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

name: Build and Publish

on:
  push:
    branches: [main, dev]
    tags: ["v*"]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fragment:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Validated against sheppy itself, not a copied script. The template's
      # validate_fragment.py requires a `container:` mapping and would reject
      # this module's compose-based fragments outright.
      - name: Install sheppy
        run: pip install pyyaml "sheppy @ git+https://github.com/rammp-org/sheppy@main"

      - name: Validate the fragments
        run: python3 scripts/check_fragments.py rammp-alternative*.yaml

  smoke:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # The SIM image: smoke is the hardware-free path by design, and the
      # runner has no arm. The fragment declaring the real arm does not change
      # what CI can run.
      - name: Build the sim image
        run: docker build -t kinova-gen3-ros2:ci .

      - name: Publishes, and exits on SIGTERM
        run: SMOKE_PATTERN="kinova_gen3_node up" ./scripts/smoke.sh kinova-gen3-ros2:ci

  # The image that actually drives a robot. The sim image above cannot, so
  # without this job a change that broke only the KORTEX path would reach the
  # arm uncaught.
  #
  # BOTH architectures. Kinova publishes a per-arch SDK and the Dockerfile picks
  # by TARGETARCH: aarch64_gcc_7.4 for arm64, x86-64_gcc_5.4 for amd64. The
  # amd64 SDK spans the gcc 5.4 -> 11 C++11 ABI change, which makes linking the
  # part worth guarding: the binary has to carry the real KortexTransport (31
  # symbols), not the sim fallback.
  #
  # amd64 matters beyond coverage: the driver reaches the arm over IP, so an
  # x86-64 KORTEX image lets a laptop drive the robot without a Jetson.
  #
  # arm64 builds under QEMU here, so this job does not also run the smoke test.
  # Compiling and LINKING is what breaks; startup is covered by the sim smoke.
  #
  # This job is also the release. On a v* tag it pushes both arches to ghcr as a
  # single manifest, so `docker pull ghcr.io/rammp-org/kinova-gen3-ros2:1.0.0`
  # resolves to the right architecture on a Jetson or a laptop. Branch and PR
  # builds compile and discard. It needs fragment and smoke green first: a tag
  # must not publish an image whose validation failed.
  kortex:
    needs: [fragment, smoke]
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      # ghcr rejects an uppercase path, and the org name is mixed case.
      - id: image
        name: Compute lowercase image name
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to ghcr
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Semver only: an image is a release artifact, so branch and sha tags would
      # just accumulate. `latest` follows the newest non-prerelease tag, which is
      # metadata-action's default and what a bare `docker pull` gets.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Build the KORTEX image (both arches, fetches the SDK)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64,linux/amd64
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            KINOVA_ENABLE_KORTEX=ON

  # Both architectures of the sim image, built and discarded.
  #
  # Deliberately never pushed: the sim image cannot drive an arm, so shipping it
  # under a release tag invites someone to pull 1.0.0 and find an artifact that
  # does not do the job. The KORTEX job above is the one that publishes. This
  # job exists to prove the sim image still builds on arm64, which the smoke job
  # cannot show -- it builds natively on an x86-64 runner.
  multiarch:
    needs: [fragment, smoke, kortex]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      # amd64 is a supported target, not a side effect: cmeel ships
      # manylinux_2_28_x86_64 wheels, and conformance passes 32/32 there, the
      # same as arm64.
      - name: Build both architectures
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64,linux/amd64
          push: false

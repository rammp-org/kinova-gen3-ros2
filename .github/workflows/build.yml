name: Build and Publish

on:
  push:
    branches: [main, dev]
    tags: ["v*"]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fragment:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Validated against sheppy itself, not a copied script. The template's
      # validate_fragment.py requires a `container:` mapping and would reject
      # this module's compose-based fragments outright.
      - name: Install sheppy
        run: pip install pyyaml "sheppy @ git+https://github.com/rammp-org/sheppy@main"

      - name: Validate the fragments
        run: python3 scripts/check_fragments.py rammp-alternative*.yaml

  smoke:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # The SIM image: smoke is the hardware-free path by design, and the
      # runner has no arm. The fragment declaring the real arm does not change
      # what CI can run.
      - name: Build the sim image
        run: docker build -t kinova-gen3-ros2:ci .

      - name: Publishes, and exits on SIGTERM
        run: SMOKE_PATTERN="kinova_gen3_node up" ./scripts/smoke.sh kinova-gen3-ros2:ci

  # The image that actually drives a robot. Until now it had NO automated
  # coverage: the SDK lived only in a developer's home directory, so every
  # KORTEX build in this project's history was run by hand, and a change that
  # broke only this path would have reached the arm uncaught.
  #
  # BOTH architectures. Kinova publishes a per-arch SDK and the Dockerfile picks
  # by TARGETARCH: aarch64_gcc_7.4 for arm64, x86-64_gcc_5.4 for amd64. The
  # amd64 one spans the gcc 5.4 -> 11 C++11 ABI change and was checked rather
  # than assumed -- it links clean, the node starts, and the binary carries the
  # real KortexTransport (31 symbols), not the sim fallback.
  #
  # amd64 matters beyond coverage: the driver reaches the arm over IP, so an
  # x86-64 KORTEX image lets a laptop drive the robot without a Jetson.
  #
  # arm64 builds under QEMU here, so this job does not also run the smoke test.
  # Compiling and LINKING is what breaks; startup is covered by the sim smoke.
  #
  # Builds only. Nothing is pushed: the SDK carries no licence of its own, and
  # building is not redistributing.
  kortex:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Build the KORTEX image (both arches, fetches the SDK)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64,linux/amd64
          push: false
          build-args: |
            KINOVA_ENABLE_KORTEX=ON

  # Both architectures of the sim image, built and discarded.
  #
  # This job used to publish to ghcr. It no longer pushes anything, for a reason
  # worth stating: the sim image cannot drive an arm, so publishing it invites
  # someone to pull 1.0.0 and find an artifact that does not do the job. The
  # image worth publishing is the KORTEX one, and whether it MAY be published
  # depends on terms the SDK artifact does not state -- it ships no licence file
  # and its headers carry no notice. Kinova's published licence for this API is
  # BSD-3-Clause, which would permit binary redistribution with the notice
  # attached, but that covers a repo of examples rather than this binary.
  #
  # So CI proves both images build, and publishes neither. To turn publishing
  # back on once the terms are settled: restore the ghcr login and
  # docker/metadata-action steps, and set push: true.
  multiarch:
    needs: [fragment, smoke, kortex]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      # amd64 is verified, not assumed: it builds (cmeel ships
      # manylinux_2_28_x86_64 wheels), the node starts, and conformance passes
      # 32/32 there -- the same numbers as arm64.
      - name: Build both architectures
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64,linux/amd64
          push: false
